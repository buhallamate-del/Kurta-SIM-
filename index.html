<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kurta szimulátor</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#burp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ffe066,#e8590c);color:#3a1600;font-weight:900;font-size:22px;letter-spacing:1px;box-shadow:0 6px 0 #7a2a00,0 8px 20px rgba(0,0,0,.5);touch-action:none;z-index:5}
#burp:active{transform:translateY(4px);box-shadow:0 2px 0 #7a2a00}
#burp.low{filter:grayscale(.7) brightness(.8)}
#burp.ready{animation:pulse .45s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.09);box-shadow:0 6px 0 #7a2a00,0 0 30px #ffd23f}}
.topbtn{position:fixed;top:calc(8px + env(safe-area-inset-top));width:42px;height:42px;border-radius:12px;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:20px;z-index:5}
#statsBtn{right:10px}#muteBtn{right:58px}
#ov{position:fixed;inset:0;background:rgba(8,8,16,.9);color:#fff;display:flex;flex-direction:column;align-items:center;padding:28px 18px;box-sizing:border-box;text-align:center;overflow:auto;z-index:10}
#ov.hidden{display:none}
#ov h1{font-size:44px;line-height:.95;margin:10px 0 8px;font-weight:900;letter-spacing:1px;color:#ffd23f;text-shadow:0 4px 0 #b3400a,0 0 30px rgba(255,140,0,.4)}
#ov h2{font-size:28px;margin:6px 0;color:#ffd23f}
#ov .sub{font-family:Georgia,serif;font-style:italic;font-size:18px;opacity:.9;margin:4px 0 14px}
#ov .how{text-align:left;max-width:440px;font-size:15px;line-height:1.45;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px}
#ov .how p{margin:6px 0}
#ov button.big{margin:16px 0 6px;font-size:22px;font-weight:900;padding:14px 34px;border-radius:40px;border:3px solid #fff;background:linear-gradient(#ffd23f,#e8590c);color:#3a1600;box-shadow:0 5px 0 #7a2a00}
#ov table{border-collapse:collapse;max-width:440px;width:100%;font-size:15px;margin:8px 0}
#ov td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
#ov td:last-child{text-align:right;font-weight:700;color:#ffd23f}
#ov .log{max-width:440px;width:100%;font-size:13px;text-align:left;opacity:.9}
#ov .log div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
#ov .rec{opacity:.75;font-size:14px}
#ov .tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap;justify-content:center}
#ov .tabs button{background:none;border:1px solid #9b7bff;color:#cbb9ff;border-radius:20px;padding:7px 12px;font-weight:700}
#ov .tabs button.on{background:#9b7bff;color:#120a24}
#ov .card{max-width:440px;width:100%;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(155,123,255,.5);border-radius:12px;padding:10px 14px;box-sizing:border-box}
#ov .kicsi{font-size:13px;opacity:.9;line-height:1.4}
#ov .row{display:flex;gap:6px;margin:8px 0}#ov .row input{flex:1;padding:9px;border-radius:10px;border:1px solid #9b7bff;background:#120a24;color:#fff;font-size:15px}
#ov .row button{border:1px solid #ffd23f;border-radius:10px;background:none;color:#ffd23f;font-weight:800;padding:9px 12px}
#ov a.kapu{display:inline-block;margin:6px 8px 0 0;padding:8px 12px;border-radius:10px;border:1px solid #9b7bff;color:#cbb9ff;text-decoration:none;font-weight:700}
#ov button.mv{margin-top:6px;font-size:15px;font-weight:800;padding:9px 18px;border-radius:30px;border:2px solid #9b7bff;background:rgba(155,123,255,.15);color:#cbb9ff}
#ov .hir{max-width:440px;background:rgba(155,123,255,.15);border:1px solid #9b7bff;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px;text-align:left}
</style>
</head>

<div id="ov"></div>

const WIN_DB=440;
function stageOf(db){let s=0;for(let i=0;i<STAGES.length;i++)if(db>=STAGES[i].db)s=i;return s}
function kindOf(s){return s<=7?'street':s<=10?'city':'planet'}
function energyJ(db){return 1.26e-5*Math.pow(10,(db-60)/10)}
function nice(v){return v>=100?Math.round(v).toLocaleString('hu-HU'):v>=10?v.toFixed(0):v.toFixed(1).replace('.',',')}
function sup(n){const m='⁰¹²³⁴⁵⁶⁷⁸⁹';return String(n).split('').map(c=>c==='-'?'⁻':m[+c]).join('')}
function fmtTNT(J){const g=J/4184;
 const T=[[1e-6,'ng',1e9],[1e-3,'µg',1e6],[1,'mg',1e3],[1e3,'g',1],[1e6,'kg',1e-3],[1e9,'tonna',1e-6],[1e12,'kilotonna',1e-9],[1e15,'megatonna',1e-12],[1e18,'gigatonna',1e-15]];
 for(const [lim,name,mul] of T)if(g<lim)return nice(g*mul)+' '+name+' TNT';
 return '10'+sup(Math.floor(Math.log10(J)))+' joule'}

let AC=null,master=null,noiseBuf=null,muted=false;
function initAudio(){
 if(AC){if(AC.state!=='running')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-4;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;
 master=AC.createGain();master.gain.value=muted?0:0.95;master.connect(comp);comp.connect(AC.destination);
 loadSamples();noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}

function stretchBurp(src,rate,target){
 const sr=AC.sampleRate,inp=src.getChannelData(0),L=inp.length,N=Math.max(1,Math.floor(target*sr)),out=AC.createBuffer(1,N,sr),o=out.getChannelData(0);
 const G=Math.floor(sr*0.07),hop=G>>1,win=new Float32Array(G);for(let j=0;j<G;j++)win[j]=0.5-0.5*Math.cos(2*Math.PI*j/G);
 const att=Math.min(L*0.18,sr*0.12)/rate,rel=L*0.25/rate,s0=L*0.18,s1=L*0.72;let ptr=s0,dir=1;
 const rd=x=>{const i=Math.floor(x),f=x-i;return i<0||i>=L-1?0:inp[i]*(1-f)+inp[i+1]*f};
 for(let pos=0;pos<N;pos+=hop){let sp;
  if(pos<att)sp=pos*rate;else if(pos>N-rel)sp=L-(N-pos)*rate;
  else{ptr+=dir*hop*rate*rnd(0.3,1.1);if(ptr>s1-G*rate){ptr=s1-G*rate;dir=-1}if(ptr<s0){ptr=s0;dir=1}if(Math.random()<0.08)dir=-dir;sp=ptr}
  for(let j=0;j<G&&pos+j<N;j++)o[pos+j]+=win[j]*rd(sp+j*rate)}
 return out}

function burpBuffer(pw,dur,opt){
 opt=opt||{};
 const sr=AC.sampleRate,N=Math.floor(sr*(dur+0.12)),buf=AC.createBuffer(1,N,sr),d=buf.getChannelData(0);
 const f0b=(opt.f0||(98-52*pw))*rnd(.9,1.1);
 const V=opt.vowels||[[430,1400,2400],[730,1150,2500],[470,860,2300]]; // ö -> á -> o
 const BW=[110,150,240],GN=[1,0.6,0.25];
 const mk=n=>{const a=[];for(let i=0;i<n;i++)a.push(Math.random()*2-1);return a};
 const s1=mk(Math.ceil(dur*25)+4),s2=mk(Math.ceil(dur*6)+4);
 const smooth=(a,r,t)=>{const x=t*r,i=Math.floor(x),f=x-i;return a[i]*(1-f)+a[i+1]*f};
 const st=[[0,0],[0,0],[0,0],[0,0]];let co=null,next=0,pulse=0,peak=0;
 const jit=opt.jit!=null?opt.jit:0.32,chest=opt.chest!=null?opt.chest:0.4+pw*0.9,breath=opt.noise!=null?opt.noise:0.05+0.1*pw;
 for(let i=0;i<N;i++){
  const t=i/sr,pr=Math.min(1,t/dur);
  let e=t<0.03?t/0.03:t<dur*0.8?1:t<dur?Math.max(0,(dur-t)/(dur*0.2)):0;
  e*=0.7+0.3*smooth(s2,6,t);
  if((i&63)===0){const first=pr<0.4,seg=first?pr/0.4:(pr-0.4)/0.6,a=first?V[0]:V[1],b=first?V[1]:V[2];co=[];
   for(let k=0;k<3;k++){const f=(a[k]+(b[k]-a[k])*seg)*(1+0.05*smooth(s1,25,t+k*0.3));const w=2*Math.PI*f/sr,r=Math.exp(-Math.PI*BW[k]/sr);co.push([2*r*Math.cos(w),r*r,(1-r)*GN[k]*Math.sin(w)])}
   const w=2*Math.PI*150/sr,r=Math.exp(-Math.PI*70/sr);co.push([2*r*Math.cos(w),r*r,(1-r)*chest*Math.sin(w)])}
  if(i>=next&&t<dur){const f0=f0b*(1.3-0.5*pr)*(1+0.22*smooth(s1,25,t*1.7));next=i+sr/f0*(1+(Math.random()-0.5)*jit);if(Math.random()>0.07)pulse+=e*(0.45+Math.random()*1.0)}
  let x=pulse;pulse*=0.5;x+=(Math.random()*2-1)*e*breath;

 G.log.unshift({n:G.burps,db,s:stage,full});
 const prevEnv=G.env;univ.set('ku:elso');if(full&&stage>=8)univ.set('ku:lokeshullam');if(full){G.env=Math.max(G.env,stage);G.maxBurps++;G.level=Math.min(15,L+1)}
 const pw=clamp((db-40)/400,0,1),sdur=0.4+pw*5.6;sBurp(pw,sdur);
 G.gas=0;G.press=0;G.shake=Math.min(26,2+stage*1.7*(full?1:0.5));

 G.mouth=Math.min(dur,sdur+0.2);
 G.cine={t:0,dur,db,stage,kind,full,num:G.burps,pts,lvl:G.level};

 burst(mx,my,10+stage*3,['#9acd32','#b5d334','#7a9a2a','#c8d96b'],120+stage*25,-40,1.4,5+stage*0.6);
 if(full){for(const it of G.items)if(!DRINK[it.type]){it.dead=true;burst(it.x,it.y,8,'#fff',200,400,0.5,3)}G.items=G.items.filter(i=>!i.dead)}

  else if(stage>=4){p.state='shake';p.st=1.4;p.bub={text:pick(['Jaj a fülem!','De, LELKES!!!','levendulaaaa']),t:1.6}}

const keys={l:false,r:false};
function update(dt){
 G.time+=dt;if(G.hintT>0)G.hintT-=dt;
 G.shake=Math.max(0,G.shake-dt*(G.shake*2.2+1));
 updateLife(dt);
 if(G.cine){G.cine.t+=dt;G.mouth=Math.max(0,G.mouth-dt);if(G.cine.t>=G.cine.dur)endCine();return}
 if(G.over)return;
 const sp=W*1.25*(G.energ>0?1.6:1);
 if(keys.l)G.tx=G.kx-80;if(keys.r)G.tx=G.kx+80;
 G.kx+=clamp(G.tx-G.kx,-sp*dt,sp*dt);G.kx=clamp(G.kx,kw,W-kw);
 G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=Math.max(0.38,1.0-G.level*0.04)*rnd(0.7,1.3);spawnDrink()}
 if(G.burps>=1){G.hazT-=dt;if(G.hazT<=0){G.hazT=(G.env<8?Math.max(1.5,3.6-G.env*0.22):Math.max(0.75,2.6-(G.env-8)*0.24))*rnd(.75,1.25);spawnHazard()}}
 const top=groundY-kh;
 for(const it of G.items){it.x+=it.vx*dt;it.vy+=it.g*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;
  if(DRINK[it.type]){if(Math.abs(it.x-G.kx)<kw*0.95&&it.y>top-kh*0.15&&it.y<groundY-kh*0.3){it.dead=true;drink(it)}}
  else{if(G.inv<=0&&Math.abs(it.x-G.kx)<kw*0.65&&it.y>top&&it.y<groundY){it.dead=true;hurt(it)}
   else if(it.y>groundY-4&&it.vy>0){it.dead=true;burst(it.x,groundY-6,10,it.type==='meteor'?['#ff7a1a','#ffd23f','#555']:['#b9a58a','#8a7a66'],160,700,0.6,3);if(it.type==='meteor')G.shake=Math.max(G.shake,5)}}
  if(it.y>H+60||it.x<-80||it.x>W+80)it.dead=true}
 G.items=G.items.filter(i=>!i.dead);
 if(G.gas>=100){G.press+=dt;G.beepT-=dt;if(G.beepT<=0){G.beepT=0.85;sGurgle()}
  if(G.press>=pressLimit()){G.press=0;G.gas=0;G.lives--;G.livesLost++;G.noses++;sNose();G.shake=6;float('Orron át távozott! −1 élet',G.kx,groundY-kh*1.4,'#ff6b6b',19);if(G.lives<=0)gameOver()}}
 else G.press=0;
 G.energ-=dt;G.inv-=dt;G.armUp-=dt;G.mouth=Math.max(0,G.mouth-dt);
 const b=$('burp');b.className=G.gas>=100?'ready':G.gas<10?'low':'';
}
function updateLife(dt){
 if(G.env<8&&!G.over){G.pedT-=dt;if(G.pedT<=0&&G.peds.filter(p=>p.state!=='fly').length<4){G.pedT=rnd(1.4,3.4);const dir=Math.random()<.5?1:-1;
  const gm=!G.peds.some(p=>p.grandma)&&Math.random()<0.45;
  G.peds.push({x:dir>0?-30:W+30,dir,v:rnd(26,46),grandma:gm,state:'walk',rot:0,yo:0,ph:Math.random()*6,bub:null,col:pick(['#cfd3d8','#b8bcc2','#a9aeb5','#d9dcdf'])})}}
 for(const p of G.peds){if(p.bub){p.bub.t-=dt;if(p.bub.t<=0)p.bub=null}
  if(p.state==='walk'){p.x+=p.dir*p.v*dt;p.ph+=dt*8;p.chat=(p.chat==null?rnd(1,4):p.chat)-dt;if(p.chat<=0&&!p.bub&&p.x>20&&p.x<W-20){p.chat=rnd(4,8);p.bub={text:pick(IDLE),t:1.8}}if(p.x<-60||p.x>W+60)p.dead=true}
  else if(p.state==='shake'){p.st-=dt;if(p.st<=0)p.state='walk'}
  else if(p.state==='down'){p.rot+=(p.trot-p.rot)*Math.min(1,dt*8);p.st-=dt;if(p.st<=0){p.state='walk';p.rot=0}}
  else if(p.state==='fly'){p.x+=p.vx*dt;p.yo+=p.vy*dt;p.vy+=500*dt;p.rot+=p.vr*dt;if(p.x<-120||p.x>W+120||p.yo>H)p.dead=true}}
 G.peds=G.peds.filter(p=>!p.dead);
 for(const c of G.cars){if(G.env<7){c.x+=c.v*dt;if(c.x>W+60)c.x=-60;if(c.x<-60)c.x=W+60}else c.rot+=(Math.PI-c.rot)*Math.min(1,dt*3)}
 for(const p of G.parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*0.8;p.life-=dt}
 G.parts=G.parts.filter(p=>p.life>0);
 for(const f of G.floats){f.t-=dt;f.y-=40*dt}
 G.floats=G.floats.filter(f=>f.t>0);
}

const VS_BROKER='wss://broker.hivemq.com:8884/mqtt',VS_CS='multiverzum-bajnoksag-r4w8';
function vsHet(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);

function inditVerseny({jatek,ertek,rendez,jutalom,valtozott}){
  const id=(()=>{let i;try{i=localStorage.getItem('multiverzum-id')}catch(e){}if(!i){i=Math.random().toString(36).slice(2,10);try{localStorage.setItem('multiverzum-id',i)}catch(e){}}return i})();
  const V={be:false,het:vsHet(),lap:{},elozo:{},jelen:{},hirek:[],k:null,kuld:'',uz:'Kapcsolódás…',id};
  V.elozoHet=vsHet(new Date(Date.now()-7*864e5));
  V.nev=()=>{try{return localStorage.getItem('multiverzum-nev')||''}catch(e){return ''}};
  V.nevBe=n=>{n=String(n||'').trim().slice(0,24);try{localStorage.setItem('multiverzum-nev',n)}catch(e){}V.kuld='';V.kozol();jelenKuld()};
  const tiszta=o=>o&&typeof o.id==='string'&&o.v&&typeof o.v==='object'?{id:o.id,nev:String(o.nev||'?').slice(0,24),v:o.v,ts:+o.ts||0}:null;
  V.rangsor=(L=V.lap,sajat=true)=>{const l={...L};if(sajat){const v=ertek();if(v)l[id]={id,nev:V.nev()||'Névtelen',v,ts:Date.now()}}
    return Object.values(l).filter(Boolean).map(x=>({...x,en:x.id===id})).filter(x=>x.en||Object.values(x.v).some(v=>+v>0)).sort((a,b)=>rendez(a.v,b.v))};
  const jt=()=>VS_CS+'/jelen/'+jatek+'/'+id;
  function jelenKuld(){if(V.be)V.k.publish(jt(),JSON.stringify({nev:V.nev()||'Névtelen'}),{qos:0,retain:true})}
  V.kozol=()=>{if(!V.be||!V.nev())return;const v=ertek();if(!v)return;const s=JSON.stringify(v);if(s===V.kuld)return;V.kuld=s;
    V.k.publish(VS_CS+'/'+jatek+'/'+V.het+'/'+id,JSON.stringify({id,nev:V.nev(),v,ts:Date.now()}),{qos:0,retain:true})};
  V.hir=t=>{if(V.be&&V.nev())V.k.publish(VS_CS+'/'+jatek+'/e',JSON.stringify({id,nev:V.nev(),t:String(t).slice(0,140)}),{qos:0})};
  V.fent=()=>Object.keys(V.jelen).length;
  // az előző hét győztese: egyszer, ha mi voltunk az elsők (és nem egyedül)
  let bajnokNezve=false;
  function bajnokCsekk(){if(bajnokNezve)return;const R=V.rangsor(V.elozo,false);if(R.length<2||R[0].id!==id)return;bajnokNezve=true;
    let n={};try{n=JSON.parse(localStorage.getItem('univerzum-naplo'))||{}}catch(e){}const k=jatek+':bajnok:'+V.elozoHet;if(n[k])return;
    n[k]=Date.now();try{localStorage.setItem('univerzum-naplo',JSON.stringify(n))}catch(e){}jutalom(V.elozoHet,R.length)}
  (async()=>{let mqtt;try{const mod=await import('./vendor/mqtt/mqtt.esm.js');mqtt=mod.default?.connect?mod.default:mod.default?.default??mod}catch(e){V.uz='A versenyhez nem sikerült betölteni a hálózati könyvtárat.';valtozott();return}
    V.k=mqtt.connect(VS_BROKER,{clientId:jatek+'_'+id+'_'+Math.random().toString(36).slice(2,6),clean:true,keepalive:30,reconnectPeriod:5000,connectTimeout:10000,will:{topic:jt(),payload:'',qos:0,retain:true}});
    V.k.on('connect',()=>{V.be=true;V.uz='';V.het=vsHet();V.k.subscribe(VS_CS+'/'+jatek+'/'+V.het+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/'+V.elozoHet+'/+');
      V.k.subscribe(VS_CS+'/jelen/'+jatek+'/+');V.k.subscribe(VS_CS+'/'+jatek+'/e');jelenKuld();V.kuld='';V.kozol();valtozott();setTimeout(bajnokCsekk,4000)});
    V.k.on('close',()=>{if(V.be){V.be=false;V.uz='A kapcsolat megszakadt, újrapróbálom…';valtozott()}});

    V.k.on('message',(tema,adat)=>{const r=tema.slice(VS_CS.length+1).split('/');let o=null;try{const s=adat.toString();o=s?JSON.parse(s):null}catch(e){return}
      if(r[0]==='jelen'){if(r[2]===id)return;if(o)V.jelen[r[2]]=String(o.nev||'?').slice(0,24);else delete V.jelen[r[2]]}

 else{const kap=AJANDEKOK.filter(a=>n['ku:ajandek:'+a[0]]);
  h+='<div class="card"><p class="kicsi">Ami a többi világban történik, az itt is számít: minden nagy esemény egyszer +1 életet ad a következő menetre.</p><p><b>Tartalék élet most: +'+(M.bonus||0)+'</b></p>'
   +(kap.length?kap.map(a=>'<p class="kicsi">✔ '+a[1]+'</p>').join(''):'<p class="kicsi">Még semmi. Járj a többi világban is.</p>')+'</div>'}
 h+='<button class="big" id="mvVissza">VISSZA</button>';ov.innerHTML=h;
 ov.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>showMulti(b.dataset.mv));
 const ok=$('vsOk');if(ok)ok.onclick=()=>{const v=$('vsNev').value.trim();if(v)VS.nevBe(v);showMulti('verseny')};
 $('mvVissza').onclick=()=>{mvLap=null;if(G&&G.over)showEnd(G.won);else if(G&&G.paused&&G.burps+G.time>0.1&&!G.over)showStats();else showStart()};
}

function statsRows(){const d=G.drank;return `<table>
 <tr><td>Pontszám</td><td>${G.score.toLocaleString('hu-HU')}</td></tr>
 <tr><td>Böfik száma</td><td>${G.burps}</td></tr>
 <tr><td>Leghangosabb böfi</td><td>${G.maxDb||0} dB</td></tr>
 <tr><td>Legnagyobb pusztítás</td><td>${G.burps?STAGES[G.env].name:'–'}</td></tr>
 <tr><td>Szint</td><td>${G.level+1} / 16</td></tr>
 <tr><td>Összes kiböfögött energia</td><td>${G.totalE?fmtTNT(G.totalE):'–'}</td></tr>
 <tr><td>MAX böfik (szintlépések)</td><td>${G.maxBurps}</td></tr>
 <tr><td>Orron át távozott</td><td>${G.noses}×</td></tr>
 <tr><td>Megivott kóla</td><td>${d.kola} db</td></tr>
 <tr><td>Megivott spréjt (gázengedő)</td><td>${d.sprajt} db</td></tr>
 <tr><td>Megivott Bika energiaital</td><td>${d.bika} db</td></tr>
 
 <tr><td>Elvesztett életek</td><td>${G.livesLost}</td></tr></table>
 <div class="log"><b>Böfinapló</b>${G.log.slice(0,25).map(l=>`<div>#${l.n} · <b>${l.db} dB</b> · ${STAGES[l.s].name}${l.full?' · ⭐ MAX':' · félböfi'}</div>`).join('')||'<div>Még egy böfi sem. Szégyen.</div>'}</div>`}
function startRun(){initAudio();newGame();mvLap=null;ov.classList.add('hidden');if(M.bonus>0){G.lives+=M.bonus;float('Multiverzum: +'+M.bonus+' élet',W/2,H*0.4,'#cbb9ff',20);M.bonus=0;mentes()}}
function showStart(){ov.classList.remove('hidden');ov.innerHTML=`<h1>KURTA<br>SZIMULÁTOR</h1><div class="sub">Minden böfi erősebb az előzőnél.</div>
 <div class="how"><p>🥤 Kapd el a <b>kólát</b> és a <b>Bika</b> energiaitalt: ezek töltik a gyomrot gázzal. A Bika többet ad, és fel is pörget.</p>
 <p>🟢 A <b>spréjt</b> az egyetlen, ami <b>elveszi a töltöttséget</b> (−25%). Kerüld, vagy használd vészszelepnek, ha túl gyorsan teltél meg.</p>
 <p>🔴 <b>BÖFF</b> gomb (vagy szóköz). Ha <b>100%-on</b> böfögsz, <b>szintet lépsz</b>: a következő böfi hangosabb, hosszabb és pusztítóbb lesz. Kevesebbnél csak félböfi jön, szintlépés nélkül.</p>
 <p>⏱️ 100%-on viszont sokáig nem várhatsz: ha nem böfögsz időben, orron át távozik, és elveszítesz egy életet. Szintenként egyre kevesebb az időd.</p>
 <p>🩴 Az első böfi után Nagyi papucsot dob: ha eltalál, 20% gázt veszítesz. Később tégla és meteor hullik, azok életbe kerülnek. Egy MAX böfi mindet elfújja.</p>
 <p>🌍 16 szint, 60-tól ${WIN_DB} dB-ig. Az utolsónál a Föld szétszakad.</p></div>
 ${(ERKEZES||AJ_UJ.length||M.bonus)?'<div class="hir">'+(ERKEZES?'🌀 Egy másik világból érkeztél. Kurta épp egy kólát bont.<br>':'')+AJ_UJ.map(esc).join('<br>')+(M.bonus?'<br><b>Tartalék élet a következő menetre: +'+M.bonus+'</b>':'')+'</div>':''}<button class="big" id="go">INDULÁS</button><br><button class="mv" id="mvGo">🌀 MULTIVERZUM</button><div class="rec">Rekord: ${hiScore.toLocaleString('hu-HU')} pont</div><div class="rec" style="font-size:11px;margin-top:10px">Böfihangok: artisticdude (OpenGameArt, CC0) · KAPLAY Team (MIT) · XQ359 (MIT)</div>`;
 $('go').onclick=startRun;$('mvGo').onclick=()=>showMulti('verseny')}
function showStats(){if(!G||G.over)return;G.paused=true;ov.classList.remove('hidden');ov.innerHTML=`<h2>📊 Statisztika</h2>${statsRows()}<button class="big" id="cont">TOVÁBB</button>`;$('cont').onclick=()=>{G.paused=false;ov.classList.add('hidden');lastT=performance.now()}}
function showEnd(won){if(!G.jelentve){G.jelentve=true;vsMenet(G.score,G.maxDb);if(won){univ.set('ku:fold');VS.hir('szétböfögte a Földet ('+G.maxDb+' dB, '+G.score.toLocaleString('hu-HU')+' pont)')}}
if(G.score>hiScore){hiScore=G.score;try{localStorage.setItem('kurtaHi',hiScore)}catch(e){}}
 ov.classList.remove('hidden');ov.innerHTML=`<h1>${won?'A FÖLD<br>NINCS TÖBBÉ':'VÉGE'}</h1><div class="sub">${won?'Kurta lebüfögte a bolygót. Megérte?':pick(['Kurta gyomra feladta.','Nagyi nyert. Ezúttal.','Túl sok tégla, túl kevés böfi.'])}</div>${statsRows()}<button class="big" id="again">ÚJRA</button><br><button class="mv" id="mvEnd">🌀 Heti verseny</button><div class="rec">Rekord: ${hiScore.toLocaleString('hu-HU')} pont</div>`;
 $('again').onclick=startRun;$('mvEnd').onclick=()=>showMulti('verseny')}

/* ---------- BEMENET ---------- */
cv.addEventListener('pointerdown',e=>{initAudio();if(!G)return;if(G.cine){if(G.cine.t>0.8)G.cine.t=G.cine.dur;return}G.tx=e.clientX});
cv.addEventListener('pointermove',e=>{if(G&&(e.buttons||e.pointerType==='touch'))G.tx=e.clientX});
$('burp').addEventListener('pointerdown',e=>{e.preventDefault();initAudio();doBurp()});
$('statsBtn').onclick=()=>showStats();
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:0.95};
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=true;
 if(e.code==='Space'){e.preventDefault();initAudio();if(G&&!G.paused)doBurp()}if(e.code==='KeyP'||e.code==='Escape'){if(G&&G.paused&&!G.over)$('cont')?.click();else showStats()}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false});

function resize(){const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 groundY=H-110;kh=clamp(H*0.15,70,130);kw=kh*0.55;itemSc=clamp(H/700,0.9,1.5)*1.15;buildStreet();if(G){G.kx=clamp(G.kx,kw,W-kw);G.tx=G.kx}}
addEventListener('resize',resize);resize();
newGame();G.paused=true;showStart();
let lastT=performance.now();
function loop(t){const dt=Math.min(0.05,(t-lastT)/1000);lastT=t;if(G&&!G.paused&&ov.classList.contains('hidden'))update(dt);if(G)render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
